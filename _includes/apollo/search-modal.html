<div id="searchModal" class="search-modal" role="dialog" aria-labelledby="modalTitle"
     data-search-index="{{ '/assets/search-index.json' | relative_url }}">
  <div id="modal-content">
    <h1 id="modalTitle">Search</h1>
    <div id="searchBar">
      <input id="searchInput" role="combobox" autocomplete="off" spellcheck="false"
             aria-expanded="false" aria-controls="results-container" placeholder="Search...">
      <button id="clear-search" class="clear-button" title="Clear search">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
          <path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>
        </svg>
      </button>
    </div>
    <div id="results-container">
      <div id="results-info">
        <span id="zero_results" style="display: none;">No results</span>
        <span id="one_result" style="display: none;">1 result</span>
        <span id="many_results" style="display: none;"></span>
      </div>
      <div id="results" role="listbox"></div>
    </div>
  </div>
</div>
<script defer src="{{ '/assets/js/search.js' | relative_url }}"></script>
