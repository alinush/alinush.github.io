---
layout: base
---
<main>
  <article>
    {%- include snippets/get-article-title.html article=page -%}
    {%- assign _title = __return -%}
    {%- if _title and page.show_title != false -%}
      <div class="page-header">{{ _title }}</div>
    {%- endif -%}

    <section class="body js-article-body">
      {{ content }}
    </section>
  </article>
</main>
